name: Сливание с актуальным ядром

on:
  schedule:
    # Каждое воскресенье в 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  sync-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🌐 Скачивание и распаковка ядра
        run: |
          curl -L https://github.com/amurcanov/csqtt/archive/refs/heads/main.zip -o kernel.zip
          unzip kernel.zip
          ls -la csqtt-main/

      - name: 📂 Копирование папок rust-client и shared
        run: |
          rm -rf rust-client shared
          cp -r csqtt-main/rust-client .
          cp -r csqtt-main/shared .
          echo "✅ Папки скопированы"

      - name: 🔧 Настройка Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📝 Проверка изменений
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Изменений нет"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git status --short
          fi

      - name: 🚀 Прямой пуш в main
        if: steps.check.outputs.changed == 'true'
        run: |
          git add rust-client shared
          git commit -m "🔄 Сливание с актуальным ядром от $(date +%Y-%m-%d)"
          git push origin main
          echo "✅ Изменения запушены в main"

      - name: 🚀 Запуск build.yml через GitHub CLI
        if: steps.check.outputs.changed == 'true'
        run: |
          gh workflow run build.yml --ref main
          echo "✅ build.yml запущен"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: 🧹 Очистка
        if: always()
        run: |
          rm -rf csqtt-main kernel.zip
