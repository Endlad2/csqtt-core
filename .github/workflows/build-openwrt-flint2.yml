#
# Сборка CSQTT-core 2.1.5 (Flint2 fork, ветка openwrt-2.0.0) под OpenWrt 25.12.5.
#
# Workflow качает OpenWrt SDK САМ (не полагается на openwrt/download-openwrt-sdk.sh
# из репы — там может быть другая версия или путь).
# Скрипты build-musl.sh / build-tun-adapter.sh получают SDK через SDK_ROOT.
#
# КРИТИЧНО:
#   1) target ставится под тот же канал, что форсит
#      rust-client/rust-toolchain.toml (иначе E0463)
#   2) RUSTUP_TOOLCHAIN выставляется глобально, чтобы rustup не откатывался
#      на default toolchain
#   3) Кросс-линкер (aarch64-openwrt-linux-musl-gcc) приходит из SDK
#      и передаётся в cargo через CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
#      внутри build-musl.sh

name: build-openwrt-flint2

on:
  push:
    branches:
      - main
      - master
      - openwrt-2.0.0
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch/tag/commit of Endlad2/csqtt-core to build"
        required: false
        default: "openwrt-2.0.0"
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

  SOURCE_REPO: Endlad2/csqtt-core
  SOURCE_REF: openwrt-2.0.0

  # === OpenWrt SDK (готовый, официальный) ===
  # Flint 2 = aarch64_generic = armsr/armv8
  OPENWRT_RELEASE: "25.12.5"
  OPENWRT_TARGET: "armsr"
  OPENWRT_SUBTARGET: "armv8"
  SDK_NAME: openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64
  SDK_ARCHIVE: openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: 1b0316604a3e820b2b008a1baff3f9dac6716af942bef800930e58c7de98c98b

  RUST_TARGET: aarch64-unknown-linux-musl

  # Дефолт на случай, если rust-toolchain.toml не прочитается
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  build:
    name: openwrt aarch64-musl (client + tun-adapter)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Resolve source ref
        id: src
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.source_ref || env.SOURCE_REF }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building ${{ env.SOURCE_REPO }}@$REF"

      - name: Download and extract source zip
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ steps.src.outputs.ref }}"
          URL="https://github.com/${{ env.SOURCE_REPO }}/archive/refs/heads/$REF.zip"

          echo "Downloading $URL"
          curl --fail --location --retry 3 --output /tmp/source.zip "$URL" \
            || {
              echo "heads/$REF failed, trying tags/$REF"
              URL="https://github.com/${{ env.SOURCE_REPO }}/archive/refs/tags/$REF.zip"
              curl --fail --location --retry 3 --output /tmp/source.zip "$URL"
            }

          echo "Extracting..."
          unzip -q /tmp/source.zip -d /tmp/source
          EXTRACTED=$(find /tmp/source -mindepth 1 -maxdepth 1 -type d | head -n1)
          [ -n "$EXTRACTED" ] || { echo "::error::nothing extracted"; exit 1; }
          echo "Extracted to: $EXTRACTED"
          echo "SOURCE_DIR=$EXTRACTED" >> "$GITHUB_ENV"

      - name: Verify repository layout
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          for path in \
            rust-client/Cargo.toml \
            rust-client/main.rs \
            openwrt/build-musl.sh \
            openwrt/build-tun-adapter.sh \
            openwrt/tun-adapter/csqtt-tun-adapter.c
          do
            if [ ! -e "$path" ]; then
              echo "::error::missing required file: $path"
              exit 1
            fi
          done
          echo "layout OK"

      - name: Make scripts executable
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          chmod +x openwrt/build-musl.sh
          chmod +x openwrt/build-tun-adapter.sh
          [ -f openwrt/download-openwrt-sdk.sh ] && chmod +x openwrt/download-openwrt-sdk.sh || true

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang lld build-essential pkg-config \
            zstd curl unzip file tar

      # === Качаем и распаковываем OpenWrt SDK ===
      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: .cache/openwrt-sdk
          key: openwrt-sdk-${{ env.SDK_NAME }}-${{ env.SDK_SHA256 }}
          restore-keys: |
            openwrt-sdk-${{ env.SDK_NAME }}-

      - name: Download and verify OpenWrt SDK
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p .cache/openwrt-sdk
          cd .cache/openwrt-sdk

          if [ -d "${{ env.SDK_NAME }}" ]; then
            echo "SDK already extracted: $PWD/${{ env.SDK_NAME }}"
          else
            if [ ! -f "${{ env.SDK_ARCHIVE }}" ]; then
              echo "Downloading ${{ env.SDK_URL }}"
              curl --fail --location --retry 3 --output "${{ env.SDK_ARCHIVE }}.part" "${{ env.SDK_URL }}"

              echo "Verifying SHA-256..."
              ACTUAL=$(sha256sum "${{ env.SDK_ARCHIVE }}.part" | awk '{print $1}')
              if [ "$ACTUAL" != "${{ env.SDK_SHA256 }}" ]; then
                echo "::error::SDK SHA-256 mismatch"
                echo "  expected: ${{ env.SDK_SHA256 }}"
                echo "  actual:   $ACTUAL"
                exit 1
              fi
              mv "${{ env.SDK_ARCHIVE }}.part" "${{ env.SDK_ARCHIVE }}"
            fi

            echo "Extracting ${{ env.SDK_ARCHIVE }}..."
            tar --zstd -xf "${{ env.SDK_ARCHIVE }}"
            [ -d "${{ env.SDK_NAME }}" ] || {
              echo "::error::extracted dir '${{ env.SDK_NAME }}' not found"
              ls -la
              exit 1
            }
          fi

          # Экспортируем пути в GITHUB_ENV
          SDK_ROOT="$PWD/${{ env.SDK_NAME }}"
          TOOLCHAIN_BIN="$SDK_ROOT/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl/bin"
          COMPILER="$TOOLCHAIN_BIN/aarch64-openwrt-linux-musl-gcc"

          [ -x "$COMPILER" ] || {
            echo "::error::SDK toolchain missing: $COMPILER"
            ls -la "$SDK_ROOT/staging_dir/" 2>/dev/null || true
            exit 1
          }
          "$COMPILER" --version

          {
            echo "SDK_ROOT=$SDK_ROOT"
            echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN"
          } >> "$GITHUB_ENV"

          echo "SDK_ROOT=$SDK_ROOT"
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN"

      # === Rust toolchain + musl target ===
      - name: Install rustup
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
          cargo --version

      - name: Read toolchain channel from rust-toolchain.toml
        id: toolchain
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}/rust-client
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ]; then
            CHANNEL=$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml | head -n1 | sed -E 's/.*"(.*)".*/\1/')
          else
            CHANNEL="stable"
          fi
          [ -n "$CHANNEL" ] || CHANNEL="stable"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Detected toolchain channel: $CHANNEL"
          echo "RUSTUP_TOOLCHAIN=$CHANNEL" >> "$GITHUB_ENV"

      - name: Install Rust toolchain channel and musl target
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}/rust-client
        run: |
          set -euo pipefail
          CHANNEL="${{ steps.toolchain.outputs.channel }}"

          echo "==> Installing toolchain: $CHANNEL"
          rustup toolchain install "$CHANNEL" --profile minimal

          echo "==> Adding target ${{ env.RUST_TARGET }} to $CHANNEL"
          rustup target add "${{ env.RUST_TARGET }}" --toolchain "$CHANNEL"

          echo "==> rustup show"
          rustup show

          echo "==> Installed targets for $CHANNEL:"
          rustup target list --installed --toolchain "$CHANNEL" | tee /tmp/installed_targets.txt

          grep -Fx "${{ env.RUST_TARGET }}" /tmp/installed_targets.txt \
            || { echo "::error::target ${{ env.RUST_TARGET }} not installed for $CHANNEL"; exit 1; }

          echo "target installation OK"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-openwrt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-openwrt-

      # === Сборка ===
      - name: Build csqtt-tun-adapter (C)
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          SDK_ROOT: ${{ env.SDK_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ./openwrt/build-tun-adapter.sh "$PWD/dist/csqtt-tun-adapter"

      - name: Build csqtt-client (Rust)
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          SDK_ROOT: ${{ env.SDK_ROOT }}
        run: |
          set -euo pipefail
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN"
          echo "SDK_ROOT=$SDK_ROOT"
          rustup show
          rustup target list --installed | grep -Fx "${{ env.RUST_TARGET }}" \
            || { echo "::error::target not visible for $RUSTUP_TOOLCHAIN"; exit 1; }

          mkdir -p dist
          ./openwrt/build-musl.sh "$PWD/dist/csqtt-client"

      - name: Verify static linkage and print hashes
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          for BIN in dist/csqtt-client dist/csqtt-tun-adapter; do
            echo "=== $BIN ==="
            file "$BIN"
            if file "$BIN" | grep -qi 'dynamically linked'; then
              echo "::error::$BIN is dynamically linked; expected static musl"
              exit 1
            fi
            sha256sum "$BIN" | tee "$BIN.sha256"
          done

      - name: Compare client hash against FLINT2_BUILD.md reference
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum dist/csqtt-client | awk '{print $1}')
          EXPECTED="387338f1bbf6e6f3d4d95b9512fadd1633441a37aa324e9435578e3759bf5b9c"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "csqtt-client hash matches FLINT2_BUILD.md reference (OK)"
          else
            echo "::warning::csqtt-client hash $ACTUAL differs from reference $EXPECTED"
          fi

      - name: Package tarball
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          SOURCE_REPO_ENV: ${{ env.SOURCE_REPO }}
          SOURCE_REF_ENV: ${{ steps.src.outputs.ref }}
        run: |
          set -euo pipefail
          PKG="csqtt-openwrt-25.12.5-aarch64-musl-${SOURCE_REF_ENV//\//-}"
          mkdir -p "package/$PKG"

          cp dist/csqtt-client             "package/$PKG/"
          cp dist/csqtt-tun-adapter        "package/$PKG/"
          cp dist/csqtt-client.sha256      "package/$PKG/"
          cp dist/csqtt-tun-adapter.sha256 "package/$PKG/"

          [ -f openwrt/FLINT2_BUILD.md ]     && cp openwrt/FLINT2_BUILD.md     "package/$PKG/BUILD.md"
          [ -f openwrt/TUN_ADAPTER_PLAN.md ] && cp openwrt/TUN_ADAPTER_PLAN.md "package/$PKG/TUN_ADAPTER_PLAN.md"

          cat > "package/$PKG/README.txt" <<EOF
          CSQTT core + TUN adapter for OpenWrt 25.12.5 / Flint 2 (aarch64_generic, musl)

          Source: https://github.com/${SOURCE_REPO_ENV}/tree/${SOURCE_REF_ENV}

          Artifacts:
            csqtt-client        - Rust core (static musl AArch64)
            csqtt-tun-adapter   - C helper: creates csqtt0 and passes FD over abstract UDS

          Quick start (root):

            1) Adapter (creates csqtt0 and passes FD to the core):
                 ./csqtt-tun-adapter --interface csqtt0 --uds csqtt-tun-v1 --up &

            2) Core (listens on abstract UDS, takes FD, connects to TURN/VK):
                 ./csqtt-client --tun-uds csqtt-tun-v1 --peer <host:port> --vk <hash> --password <pass>

            3) Network setup (adapter does NOT do this):
                 ip addr add <TUNCONF_IP>/32 dev csqtt0
                 ip route add default dev csqtt0 table 32050
                 ip rule add fwmark 0xc5/0xff lookup 32050
                 nft add rule inet fw4 mangle_output meta mark set 0xc5

          Check:
            ip -4 route get 1.1.1.1 mark 0xc5
            tcpdump -i csqtt0 -n

          Startup order:
            Adapter retries UDS connect for up to 30 seconds (--timeout).
            Recommended: core first, then adapter.
          EOF

          tar -czf "$PKG.tar.gz" -C package "$PKG"
          sha256sum "$PKG.tar.gz" | tee "$PKG.tar.gz.sha256"
          ls -lh "$PKG.tar.gz"

          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-openwrt-25.12.5-aarch64-musl
          path: |
            ${{ env.SOURCE_DIR }}/${{ env.PKG }}.tar.gz
            ${{ env.SOURCE_DIR }}/${{ env.PKG }}.tar.gz.sha256
            ${{ env.SOURCE_DIR }}/dist/*
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SOURCE_DIR }}/${{ env.PKG }}.tar.gz
            ${{ env.SOURCE_DIR }}/${{ env.PKG }}.tar.gz.sha256
          fail_on_unmatched_files: false
