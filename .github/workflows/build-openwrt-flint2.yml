name: Build OpenWRT

on:
  push:
    branches:
      - main
      - release
    paths:
      - 'OpenWRT/**'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:

env:
  OPENWRT_VERSION: "24.10.8"
  OPENWRT_TARGET: "mediatek/filogic"
  OPENWRT_ARCH: "aarch64_cortex-a53"
  RUST_TARGET: "aarch64-unknown-linux-musl"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "RouteRich 24.10.8"
            short_name: "RouteRich"

    name: "OpenWRT - ${{ matrix.name }}"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (toolchain)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd wget file

      # Скачиваем OpenWRT toolchain (не SDK — он легче и достаточен).
      # Внутри: gcc, musl, crt1.o, libc.a под aarch64_cortex-a53.
      - name: Download OpenWRT toolchain
        run: |
          TOOLCHAIN_BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          wget -q -O /tmp/index.html "${TOOLCHAIN_BASE}/"
          TOOLCHAIN_FILE=$(grep -oE 'openwrt-toolchain-[^"]+Linux-x86_64\.tar\.zst' /tmp/index.html | head -n 1)
          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "Toolchain not found. Available files:"
            grep -oE 'openwrt-[^"]+' /tmp/index.html | head
            exit 1
          fi
          echo "Downloading $TOOLCHAIN_FILE"
          wget -q "${TOOLCHAIN_BASE}/${TOOLCHAIN_FILE}" -O /tmp/toolchain.tar.zst
          mkdir -p /opt/openwrt-toolchain
          tar --use-compress-program=unzstd -xf /tmp/toolchain.tar.zst -C /opt/openwrt-toolchain
          TOOLCHAIN_DIR=$(find /opt/openwrt-toolchain -maxdepth 1 -type d -name 'toolchain-*' | head -n 1)
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> $GITHUB_ENV
          echo "Toolchain extracted to $TOOLCHAIN_DIR"
          ls -la "$TOOLCHAIN_DIR/bin/" | head

      # Проверяем, что компилятор работает и определяем его полный путь.
      - name: Locate cross-compiler
        run: |
          CC="$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-gcc"
          if [ ! -x "$CC" ]; then
            echo "Cross-compiler not found at $CC"
            find "$TOOLCHAIN_DIR" -name '*openwrt*gcc*' -type f | head
            exit 1
          fi
          echo "CC=$CC" >> $GITHUB_ENV
          echo "CC_PATH=$TOOLCHAIN_DIR/bin" >> $GITHUB_ENV
          "$CC" --version

      - name: Configure Cargo linker
        working-directory: OpenWRT
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.${RUST_TARGET}]
          linker = "${TOOLCHAIN_DIR}/bin/aarch64-openwrt-linux-musl-gcc"
          ar = "${TOOLCHAIN_DIR}/bin/aarch64-openwrt-linux-musl-ar"
          EOF
          echo "=== .cargo/config.toml ==="
          cat .cargo/config.toml

      - name: Add Rust target
        run: rustup target add ${RUST_TARGET}

      - name: Build owrt-client
        working-directory: OpenWRT
        env:
          # OpenWRT musl-toolchain ищет свой sysroot по этим переменным.
          # Без них ld не найдёт libc.a и crt1.o.
          PATH: ${{ env.CC_PATH }}:${{ env.PATH }}
          CC_aarch64_unknown_linux_musl: ${{ env.CC }}
          AR_aarch64_unknown_linux_musl: ${{ env.TOOLCHAIN_DIR }}/bin/aarch64-openwrt-linux-musl-ar
          CFLAGS_aarch64_unknown_linux_musl: "-I${{ env.TOOLCHAIN_DIR }}/include"
          RUSTFLAGS: "-C link-arg=-static -C link-arg=-L${{ env.TOOLCHAIN_DIR }}/lib"
        run: |
          cargo build --release --target ${RUST_TARGET} --verbose
          ls -la target/${RUST_TARGET}/release/

      - name: Verify binary
        working-directory: OpenWRT
        run: |
          BIN="target/${RUST_TARGET}/release/owrt-client"
          file "$BIN"
          file "$BIN" | grep -q "ARM aarch64" || { echo "Not ARM64!"; exit 1; }
          # Проверим, что это статический musl-бинарь
          "$CC" -print-file-name=libc.a >/dev/null
          echo "=== ldd (должен быть not a dynamic executable) ==="
          ldd "$BIN" || true

      - name: Prepare package
        working-directory: OpenWRT
        run: |
          BIN="target/${RUST_TARGET}/release/owrt-client"
          OUT="/tmp/owrt-client-${{ matrix.short_name }}"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/owrt-client"
          cp README.md "$OUT/README.md"
          printf '%s\n' '# Скопируй в файл config (без .example) рядом с бинарником.' 'csqtt://connect?v=2&host=31.77.148.203&peer=46000&password=ЗАМЕНИ&hashes=hash1+hash2+hash3' > "$OUT/config.example"
          ls -la "$OUT"

      - name: Upload OpenWRT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-${{ matrix.short_name }}
          path: /tmp/owrt-client-${{ matrix.short_name }}/
          if-no-files-found: error
