name: Build and Release Rust Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read
  issues: read
  packages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WORKING_DIR: rust-client
  IOS_WORKING_DIR: rust-client/ios-core

jobs:
  # ============= CHECK =============
  check:
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Cargo check
        run: cargo check --release
        working-directory: ${{ env.WORKING_DIR }}

  # ============= LINUX x86_64 =============
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-

      - name: Build
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-unknown-linux-gnu
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-x86_64
          path: ${{ env.WORKING_DIR }}/target/x86_64-unknown-linux-gnu/release/client

  # ============= LINUX ARM64 =============
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-arm64-

      - name: Configure linker
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-arm64
          path: ${{ env.WORKING_DIR }}/target/aarch64-unknown-linux-gnu/release/client

  # ============= LINUX ARMv7 =============
  build-linux-armv7:
    name: Linux ARMv7
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-armv7-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-armv7-

      - name: Configure linker
        run: |
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          echo "CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++" >> $GITHUB_ENV

      - name: Build
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          cargo build --release --target armv7-unknown-linux-gnueabihf
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-armv7
          path: ${{ env.WORKING_DIR }}/target/armv7-unknown-linux-gnueabihf/release/client

  # ============= LINUX i686 =============
  build-linux-i686:
    name: Linux i686
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-i686-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-i686-

      - name: Configure linker
        run: |
          echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc" >> $GITHUB_ENV
          echo "CC_i686_unknown_linux_gnu=gcc" >> $GITHUB_ENV
          echo "CXX_i686_unknown_linux_gnu=g++" >> $GITHUB_ENV

      - name: Build
        run: |
          rustup target add i686-unknown-linux-gnu
          cargo build --release --target i686-unknown-linux-gnu
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-i686
          path: ${{ env.WORKING_DIR }}/target/i686-unknown-linux-gnu/release/client

  # ============= WINDOWS =============
  build-windows:
    name: Windows
    runs-on: windows-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      - name: Build
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-x86_64
          path: ${{ env.WORKING_DIR }}/target/x86_64-pc-windows-msvc/release/client.exe

  # ============= MACOS =============
  build-macos:
    name: macOS
    runs-on: macos-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-

      - name: Build
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-macos-x86_64
          path: ${{ env.WORKING_DIR }}/target/x86_64-apple-darwin/release/client

  # ============= iOS SIMULATOR (x86_64) - ИЗ ios-core =============
  build-ios-simulator:
    name: iOS Simulator (x86_64) - staticlib
    runs-on: macos-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ios-sim-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-sim-

      - name: Build for iOS Simulator
        run: |
          rustup target add x86_64-apple-ios
          cargo build --release --target x86_64-apple-ios
        working-directory: ${{ env.IOS_WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libcsqtt_ios_simulator_x86_64
          path: ${{ env.IOS_WORKING_DIR }}/target/x86_64-apple-ios/release/libcsqtt_ios_core.a

  # ============= iOS DEVICE (aarch64) - ИЗ ios-core =============
  build-ios-device:
    name: iOS Device (aarch64) - staticlib
    runs-on: macos-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ios-dev-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-dev-

      - name: Build for iOS Device
        run: |
          rustup target add aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios
        working-directory: ${{ env.IOS_WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libcsqtt_ios_device_aarch64
          path: ${{ env.IOS_WORKING_DIR }}/target/aarch64-apple-ios/release/libcsqtt_ios_core.a

  # ============= iOS UNIVERSAL (Fat Binary) =============
  build-ios-universal:
    name: iOS Universal (Fat Binary)
    runs-on: macos-latest
    needs: [build-ios-simulator, build-ios-device]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download simulator artifact
        uses: actions/download-artifact@v4
        with:
          name: libcsqtt_ios_simulator_x86_64
          path: ios-artifacts/simulator

      - name: Download device artifact
        uses: actions/download-artifact@v4
        with:
          name: libcsqtt_ios_device_aarch64
          path: ios-artifacts/device

      - name: Create universal binary
        run: |
          mkdir -p ios-artifacts/universal
          lipo -create \
            ios-artifacts/simulator/libcsqtt_ios_core.a \
            ios-artifacts/device/libcsqtt_ios_core.a \
            -output ios-artifacts/universal/libcsqtt_ios_core.a
          file ios-artifacts/universal/libcsqtt_ios_core.a

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcsqtt_ios_universal
          path: ios-artifacts/universal/libcsqtt_ios_core.a

  # ============= UPLOAD ASSETS TO RELEASE =============
  upload-assets:
    name: Upload Assets to Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm64, build-linux-armv7, build-linux-i686, build-windows, build-macos, build-ios-universal]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release tag
        id: get_tag
        run: |
          echo "RELEASE_TAG=$(date +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.RELEASE_TAG }}
          name: Release ${{ steps.get_tag.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          cp artifacts/client-linux-x86_64/client release-assets/client-linux-x86_64
          cp artifacts/client-linux-arm64/client release-assets/client-linux-arm64
          cp artifacts/client-linux-armv7/client release-assets/client-linux-armv7
          cp artifacts/client-linux-i686/client release-assets/client-linux-i686
          cp artifacts/client-windows-x86_64/client.exe release-assets/client-windows-x86_64.exe
          cp artifacts/client-macos-x86_64/client release-assets/client-macos-x86_64
          cp artifacts/libcsqtt_ios_universal/libcsqtt_ios_core.a release-assets/libcsqtt_ios_core.a
          chmod +x release-assets/client-linux-x86_64 || true
          chmod +x release-assets/client-linux-arm64 || true
          chmod +x release-assets/client-linux-armv7 || true
          chmod +x release-assets/client-linux-i686 || true
          chmod +x release-assets/client-macos-x86_64 || true

      - name: Upload assets to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.RELEASE_TAG }}
          files: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update LATEST file (only on manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ steps.get_tag.outputs.RELEASE_TAG }}" > LATEST
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST
          git commit -m "Update LATEST to ${{ steps.get_tag.outputs.RELEASE_TAG }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}