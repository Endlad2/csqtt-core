name: Build and Release Rust Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# ===== ПРАВА НА ЗАПИСЬ ДЛЯ СОЗДАНИЯ РЕЛИЗОВ =====
permissions:
  contents: write
  actions: read
  checks: read
  deployments: read
  issues: read
  packages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WORKING_DIR: rust-client

jobs:
  # ============= TESTS =============
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --release
        working-directory: ${{ env.WORKING_DIR }}

  # ============= LINUX =============
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-x86_64
          path: ${{ env.WORKING_DIR }}/target/x86_64-unknown-linux-gnu/release/client

  # ============= WINDOWS =============
  build-windows:
    name: Windows
    runs-on: windows-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-x86_64
          path: ${{ env.WORKING_DIR }}/target/x86_64-pc-windows-msvc/release/client.exe

  # ============= UPLOAD ASSETS TO RELEASE =============
  upload-assets:
    name: Upload Assets to Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate release tag
        id: get_tag
        run: |
          echo "RELEASE_TAG=$(date +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.RELEASE_TAG }}
          name: Release ${{ steps.get_tag.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          cp artifacts/client-linux-x86_64/client release-assets/client-linux-x86_64
          cp artifacts/client-windows-x86_64/client.exe release-assets/client-windows-x86_64.exe
          chmod +x release-assets/client-linux-x86_64 || true
          chmod +x release-assets/client-windows-x86_64.exe || true

      - name: Upload assets to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.RELEASE_TAG }}
          files: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ steps.get_tag.outputs.RELEASE_TAG }}
          git push -f origin latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Release
          draft: false
          prerelease: false
          body: "Latest stable release from ${{ steps.get_tag.outputs.RELEASE_TAG }}"
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
